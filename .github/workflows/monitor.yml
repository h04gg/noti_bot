name: IR Monitor — 17 nguồn

on:
  workflow_dispatch:   # Trigger bởi cron-job.org (không dùng schedule GHA)

# Tránh 2 lần chạy song song nếu trigger trùng
concurrency:
  group: ir-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore IR state
        uses: actions/cache/restore@v4
        with:
          path: ir_state.json
          key: ir-monitor-state
          restore-keys: |
            ir-monitor-state

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save IR state
        uses: actions/cache/save@v4
        with:
          path: ir_state.json
          key: ir-monitor-state
