name: IR Monitor — 30 nguồn

on:
  workflow_dispatch:   # Trigger bởi cron-job.org (không dùng schedule GHA)

# Hủy lần chạy cũ nếu trigger trùng — tránh 2 job cùng đọc state cũ → gửi trùng
concurrency:
  group: ir-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Key theo nội dung file: GHA không ghi đè cache khi key trùng — key cố định
      # khiến save bị skip sau lần đầu → state không lưu → spam tin mới mỗi lần chạy.
      - name: Restore IR state
        uses: actions/cache/restore@v4
        with:
          path: ir_state.json
          key: ir-monitor-state-${{ hashFiles('ir_state.json') }}
          restore-keys: |
            ir-monitor-state-

      - name: Restore error log
        uses: actions/cache/restore@v4
        with:
          path: ir_error_log.json
          key: ir-error-log-${{ hashFiles('ir_error_log.json') }}
          restore-keys: |
            ir-error-log-

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save error log
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ir_error_log.json
          key: ir-error-log-${{ hashFiles('ir_error_log.json') }}

      - name: Save IR state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ir_state.json
          key: ir-monitor-state-${{ hashFiles('ir_state.json') }}
