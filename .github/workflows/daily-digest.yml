name: IR Monitor — Báo cáo lỗi 12:00

on:
  schedule:
    # 12:00 trưa UTC+7 (Asia/Ho_Chi_Minh) = 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ir-monitor-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore error log
        uses: actions/cache/restore@v4
        with:
          path: ir_error_log.json
          key: ir-error-log-${{ hashFiles('ir_error_log.json') }}
          restore-keys: |
            ir-error-log-

      - name: Send daily error digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --daily-digest

      - name: Save error log
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ir_error_log.json
          key: ir-error-log-${{ hashFiles('ir_error_log.json') }}
